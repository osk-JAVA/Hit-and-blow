<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヒットアンドブロー</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1b1e2a;
    --text: #eef0f6;
    --muted: #9aa0b4;
    --border: #2a2e40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f1117, #1a1d29);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app { width: 100%; max-width: 480px; }
  body[data-device="desktop"] .app { max-width: 900px; }

  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; }

  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--muted); }
  .row { margin-bottom: 16px; }
  input[type="range"] { width: 100%; }
  .digit-value { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .digit-value span:last-child { font-weight: bold; color: #4a7dff; font-size: 1.1rem; }
  input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f111a; color: var(--text); font-size: 1rem;
  }

  /* モードカード（設定画面）: 常に固有色 */
  .mode-cards { display: flex; flex-direction: column; gap: 10px; }
  .mode-card {
    border: 2px solid var(--border);
    border-left-width: 6px;
    border-radius: 12px;
    padding: 16px 16px;
    cursor: pointer;
    transition: 0.15s;
  }
  .mode-card[data-mode="beginner"] { border-left-color: #3b82f6; }
  .mode-card[data-mode="survival"] { border-left-color: #22c55e; }
  .mode-card[data-mode="master"]   { border-left-color: #eab308; }
  .mode-card[data-mode="beginner"].selected { border-color: #3b82f6; background: rgba(59,130,246,0.14); }
  .mode-card[data-mode="survival"].selected { border-color: #22c55e; background: rgba(34,197,94,0.14); }
  .mode-card[data-mode="master"].selected   { border-color: #eab308; background: rgba(234,179,8,0.14); }
  .mode-card .title { font-weight: bold; margin-bottom: 4px; }
  .mode-card .desc { font-size: 0.8rem; color: var(--muted); }

  button {
    width: 100%; padding: 18px; border: none; border-radius: 12px;
    background: #4a7dff; color: white; font-size: 1.2rem; font-weight: bold;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.98); }
  button.secondary { background: #2a2e40; margin-top: 8px; }

  /* ゲーム画面: モードごとにテーマカラーを切り替え */
  #gameScreen[data-mode="beginner"] { --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.16); }
  #gameScreen[data-mode="survival"] { --accent: #22c55e; --accent-soft: rgba(34,197,94,0.16); }
  #gameScreen[data-mode="master"]   { --accent: #eab308; --accent-soft: rgba(234,179,8,0.16); }
  #gameScreen #submitButton { background: var(--accent); color: #10131c; }

  .layout { display: flex; flex-direction: column; gap: 16px; }
  body[data-device="desktop"] .layout { flex-direction: row; align-items: flex-start; }
  body[data-device="desktop"] .main-col { flex: 3; min-width: 0; }
  body[data-device="desktop"] .side-col { flex: 2; position: sticky; top: 20px; }

  .status-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; font-size: 0.9rem; }
  .status-bar .chip { background: #0f111a; padding: 6px 12px; border-radius: 20px; color: var(--muted); border: 1px solid var(--accent-soft); }
  .status-bar .chip b { color: var(--accent); }

  .section-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }

  .box-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .digit-box {
    width: 54px; height: 62px; text-align: center; font-size: 1.6rem; font-weight: bold;
    border-radius: 10px; border: 2px solid var(--border); background: #0f111a; color: var(--text);
  }
  .digit-box:focus { outline: none; border-color: var(--accent); }
  .digit-box.confirmed { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .digit-box.duplicate { border-color: #ff6b6b; background: rgba(255,107,107,0.18); }
  .confirm-box {
    width: 48px; height: 44px; text-align: center; font-size: 1.15rem;
    border-radius: 10px; border: 1px dashed var(--border); background: transparent; color: var(--muted);
  }
  .confirm-box:focus { outline: none; border-color: var(--accent); color: var(--text); }

  .guess-area { margin-bottom: 6px; }

  .numpad {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  body[data-device="mobile"] #gameScreen .numpad { display: grid; }
  .numpad-btn {
    padding: 18px 0; border-radius: 12px; border: 2px solid var(--border);
    background: #0f111a; color: var(--text); font-size: 1.3rem; font-weight: bold; cursor: pointer;
  }
  .numpad-btn:active { background: var(--accent-soft); border-color: var(--accent); }
  .numpad-btn.backspace {
    grid-column: 1 / -1; background: #2a2e40; color: #ff6b6b; font-size: 1.1rem;
  }

  .error-text { color: #ff6b6b; font-size: 0.85rem; text-align: center; min-height: 1.2em; }
  .result-message { text-align: center; font-size: 1.1rem; font-weight: bold; min-height: 1.4em; margin: 6px 0 10px; }
  .result-message.win { color: #4ade80; }
  .result-message.lose { color: #ff6b6b; }

  .history { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 6px; }
  .history-item { display: flex; justify-content: space-between; background: #0f111a; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; }
  .history-item .nums { letter-spacing: 3px; font-weight: bold; }
  .history-item .hb span { margin-left: 8px; }
  .hb .hit { color: #4ade80; }
  .hb .blow { color: #facc15; }

  /* メモパッド */
  .memo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .memo-btn {
    padding: 20px 0; border-radius: 12px; border: 2px solid var(--border);
    background: #0f111a; color: var(--text); font-size: 1.4rem; font-weight: bold; cursor: pointer;
  }
  .memo-btn.excluded { border-color: #ff6b6b; color: #ff6b6b; text-decoration: line-through; opacity: 0.6; }
  .memo-btn.candidate { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.12); }
  .memo-hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <h1>ヒットアンドブロー</h1>
  <div class="subtitle">桁数を自由に設定、同じ数字は使われません</div>

  <!-- 設定画面 -->
  <div id="setupScreen">
    <div class="panel">
      <div class="row">
        <div class="digit-value"><span>桁数</span><span id="digitCountLabel">4</span></div>
        <input type="range" id="digitCountSlider" min="2" max="10" value="4">
      </div>

      <div class="row">
        <label>モードを選択</label>
        <div class="mode-cards">
          <div class="mode-card selected" data-mode="beginner">
            <div class="title">ビギナーズモード</div>
            <div class="desc">質問回数は無制限。今何回目かを常に表示します。</div>
          </div>
          <div class="mode-card" data-mode="survival">
            <div class="title">サバイバルモード</div>
            <div class="desc">指定した回数までしか質問できません。</div>
          </div>
          <div class="mode-card" data-mode="master">
            <div class="title">マスターモード</div>
            <div class="desc">ランダムで5〜10問、連続正解を目指します。</div>
          </div>
        </div>
      </div>

      <div class="row" id="maxGuessesRow" style="display:none;">
        <label>質問できる回数</label>
        <input type="number" id="maxGuessesInput" value="10" min="1">
      </div>

      <button id="startButton">ゲーム開始</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="gameScreen" class="hidden" data-mode="beginner">
    <div class="layout">
      <div class="main-col">
        <div class="panel">
          <div class="status-bar" id="statusBar"></div>

          <div class="section-label">確定した数字（わかっている位置に入力すると次から自動入力されます）</div>
          <div class="box-row" id="confirmRow"></div>

          <div class="section-label">回答</div>
          <div class="guess-area">
            <div class="box-row" id="guessRow"></div>
            <div class="numpad" id="numpad"></div>
          </div>
          <button id="submitButton">回答する</button>
          <div class="error-text" id="errorText"></div>
          <div class="result-message" id="resultMessage"></div>

          <div class="history" id="historyList"></div>
        </div>
      </div>

      <div class="side-col">
        <div class="panel">
          <div class="section-label">数字メモ</div>
          <div class="memo-grid" id="memoGrid"></div>
          <div class="memo-hint">タップで切り替え：白 → 除外(赤・線消し) → 候補(緑) → 白</div>
        </div>
      </div>
    </div>
    <button class="secondary" id="backButton">設定に戻る</button>
  </div>
</div>

<script>
(function () {
  const digitCountSlider = document.getElementById('digitCountSlider');
  const digitCountLabel = document.getElementById('digitCountLabel');
  const modeCards = document.querySelectorAll('.mode-card');
  const maxGuessesRow = document.getElementById('maxGuessesRow');
  const maxGuessesInput = document.getElementById('maxGuessesInput');
  const startButton = document.getElementById('startButton');

  const setupScreen = document.getElementById('setupScreen');
  const gameScreen = document.getElementById('gameScreen');
  const statusBar = document.getElementById('statusBar');
  const confirmRow = document.getElementById('confirmRow');
  const guessRow = document.getElementById('guessRow');
  const submitButton = document.getElementById('submitButton');
  const errorText = document.getElementById('errorText');
  const resultMessage = document.getElementById('resultMessage');
  const historyList = document.getElementById('historyList');
  const backButton = document.getElementById('backButton');
  const memoGrid = document.getElementById('memoGrid');
  const numpad = document.getElementById('numpad');

  let digitCount = 4;
  let mode = 'beginner';
  let maxGuesses = 10;

  let answer = [];
  let guessesUsed = 0;
  let gameActive = false;

  let masterStreakTarget = 5;
  let masterStreakCount = 0;
  let masterGuessLimitPerRound = 8;

  let confirmedDigits = [];
  let memoState = new Array(10).fill(0); // 0 neutral, 1 excluded, 2 candidate
  let submittedGuesses = []; // これまでに送信した組み合わせ（同じ組み合わせの再送信を防ぐ）
  let activeGuessIndex = 0;

  // ---------- モバイル/PC判定 ----------
  function detectMobile() {
    const uaMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const smallScreen = window.matchMedia('(max-width: 700px)').matches;
    return uaMobile || smallScreen;
  }
  function applyDevice() {
    document.body.dataset.device = detectMobile() ? 'mobile' : 'desktop';
    Array.from(guessRow.children).forEach(box => {
      box.inputMode = detectMobile() ? 'none' : 'numeric';
    });
  }
  applyDevice();
  window.addEventListener('resize', applyDevice);

  // ---------- 設定画面 ----------
  digitCountSlider.addEventListener('input', () => {
    digitCount = parseInt(digitCountSlider.value, 10);
    digitCountLabel.textContent = digitCount;
  });

  modeCards.forEach(card => {
    card.addEventListener('click', () => {
      modeCards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      mode = card.dataset.mode;
      maxGuessesRow.style.display = (mode === 'survival') ? 'block' : 'none';
    });
  });

  startButton.addEventListener('click', () => {
    if (mode === 'survival') {
      const v = parseInt(maxGuessesInput.value, 10);
      maxGuesses = (Number.isFinite(v) && v > 0) ? v : 10;
    }
    gameScreen.dataset.mode = mode;
    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    buildMemoPad();
    buildNumpad();
    startNewGame();
  });

  backButton.addEventListener('click', () => {
    gameScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
    gameActive = false;
  });

  submitButton.addEventListener('click', submitGuess);

  // ---------- ゲーム進行 ----------
  function generateAnswer() {
    const pool = Array.from({ length: 10 }, (_, i) => i);
    const result = [];
    for (let i = 0; i < digitCount; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      result.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return result;
  }

  function startNewGame() {
    gameActive = true;
    guessesUsed = 0;
    historyList.innerHTML = '';
    resultMessage.textContent = '';
    resultMessage.className = 'result-message';
    errorText.textContent = '';

    if (mode === 'master') {
      masterStreakCount = 0;
      masterStreakTarget = 5 + Math.floor(Math.random() * 6);
      masterGuessLimitPerRound = Math.max(digitCount * 2, 8);
    }

    newPuzzleReset();
    updateStatusBar();
  }

  // 新しい秘密の数字が決まるたびに、確定数字とメモをリセットして箱を作り直す
  function newPuzzleReset() {
    answer = generateAnswer();
    confirmedDigits = new Array(digitCount).fill(null);
    memoState = new Array(10).fill(0);
    submittedGuesses = [];
    buildConfirmRow();
    buildGuessRow();
    buildMemoPad();
  }

  function buildConfirmRow() {
    confirmRow.innerHTML = '';
    for (let i = 0; i < digitCount; i++) {
      const inp = document.createElement('input');
      inp.className = 'confirm-box';
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.maxLength = 1;
      inp.dataset.index = i;
      inp.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = v;
        confirmedDigits[i] = v === '' ? null : parseInt(v, 10);
        applyConfirmedToGuessRow();
      });
      confirmRow.appendChild(inp);
    }
  }

  function buildGuessRow() {
    guessRow.innerHTML = '';
    for (let i = 0; i < digitCount; i++) {
      const inp = document.createElement('input');
      inp.className = 'digit-box';
      inp.type = 'text';
      inp.inputMode = detectMobile() ? 'none' : 'numeric'; // スマホは自作の数字パッドを使わせる
      inp.maxLength = 1;
      inp.dataset.index = i;
      inp.addEventListener('focus', () => { activeGuessIndex = i; });
      inp.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = v;
        if (v !== '') {
          if (checkDuplicateGuess()) return; // 重複がある場合はフォーカス移動しない
          focusNextEditable(i);
        } else {
          checkDuplicateGuess();
        }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && i > 0) {
          focusPrevEditable(i);
        }
        if (e.key === 'Enter') submitGuess();
      });
      guessRow.appendChild(inp);
    }
    applyConfirmedToGuessRow();
  }

  function applyConfirmedToGuessRow() {
    for (let i = 0; i < digitCount; i++) {
      const box = guessRow.children[i];
      if (!box) continue;
      if (confirmedDigits[i] !== null && confirmedDigits[i] !== undefined) {
        box.value = confirmedDigits[i];
        box.classList.add('confirmed');
        box.readOnly = true; // 固定した桁は上書きできないようにする
      } else {
        box.classList.remove('confirmed');
        box.readOnly = false;
      }
    }
    const firstEditable = Array.from(guessRow.children).find(b => !b.readOnly && b.value === '');
    if (firstEditable) firstEditable.focus();
  }

  function isEditable(box) {
    return box && !box.readOnly;
  }

  function focusNextEditable(fromIndex) {
    for (let i = fromIndex + 1; i < guessRow.children.length; i++) {
      const box = guessRow.children[i];
      if (isEditable(box)) { box.focus(); return; }
    }
  }

  function focusPrevEditable(fromIndex) {
    for (let i = fromIndex - 1; i >= 0; i--) {
      const box = guessRow.children[i];
      if (isEditable(box)) { box.focus(); return; }
    }
  }

  function buildNumpad() {
    numpad.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'numpad-btn';
      btn.textContent = d;
      btn.addEventListener('click', () => inputDigitToActive(d));
      numpad.appendChild(btn);
    }
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'numpad-btn backspace';
    back.textContent = '⌫ 削除';
    back.addEventListener('click', backspaceActive);
    numpad.appendChild(back);
  }

  function inputDigitToActive(d) {
    let box = guessRow.children[activeGuessIndex];
    if (!box || box.readOnly) {
      focusNextEditable(-1); // 編集可能な最初の箱を探す
      box = guessRow.children[activeGuessIndex];
      if (!box || box.readOnly) return;
    }
    box.value = String(d);
    if (checkDuplicateGuess()) return;
    focusNextEditable(activeGuessIndex);
  }

  function backspaceActive() {
    let box = guessRow.children[activeGuessIndex];
    if (box && !box.readOnly && box.value !== '') {
      box.value = '';
      checkDuplicateGuess();
      return;
    }
    focusPrevEditable(activeGuessIndex);
    box = guessRow.children[activeGuessIndex];
    if (box && !box.readOnly) {
      box.value = '';
      checkDuplicateGuess();
    }
  }

  function buildMemoPad() {
    memoGrid.innerHTML = '';
    for (let d = 0; d <= 9; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'memo-btn';
      btn.textContent = d;
      btn.addEventListener('click', () => {
        memoState[d] = (memoState[d] + 1) % 3;
        btn.classList.remove('excluded', 'candidate');
        if (memoState[d] === 1) btn.classList.add('excluded');
        if (memoState[d] === 2) btn.classList.add('candidate');
      });
      memoGrid.appendChild(btn);
    }
  }

  function checkDuplicateGuess() {
    const boxes = Array.from(guessRow.children);
    const counts = {};
    boxes.forEach(b => { if (b.value !== '') counts[b.value] = (counts[b.value] || 0) + 1; });

    let duplicateValue = null;
    boxes.forEach(b => {
      const isDup = b.value !== '' && counts[b.value] > 1;
      b.classList.toggle('duplicate', isDup);
      if (isDup) duplicateValue = b.value;
    });

    if (duplicateValue !== null) {
      errorText.textContent = `「${duplicateValue}」は一度入力しました`;
      return true;
    }
    if (errorText.textContent.includes('は一度入力しました')) {
      errorText.textContent = '';
    }
    return false;
  }

  function submitGuess() {
    if (!gameActive) return;
    const values = Array.from(guessRow.children).map(b => b.value);

    if (values.some(v => v === '')) {
      errorText.textContent = `${digitCount}桁すべて入力してください`;
      return;
    }
    if (checkDuplicateGuess()) {
      return; // 同じ数字が重複している場合は送信しない
    }

    const raw = values.join('');
    if (submittedGuesses.includes(raw)) {
      errorText.textContent = 'それは一度入力しました';
      return; // 同じ組み合わせは再送信できない
    }

    errorText.textContent = '';

    const guess = values.map(Number);
    guessesUsed++;
    submittedGuesses.push(raw);

    let hit = 0, blow = 0;
    for (let i = 0; i < digitCount; i++) {
      if (guess[i] === answer[i]) hit++;
      else if (answer.includes(guess[i])) blow++;
    }

    addHistory(values.join(''), hit, blow);

    if (hit === digitCount) {
      handleCorrect();
    } else {
      handleWrong();
      applyConfirmedToGuessRow();
    }
  }

  function addHistory(raw, hit, blow) {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <span class="nums">${guessesUsed}: ${raw}</span>
      <span class="hb"><span class="hit">${hit} Hit</span><span class="blow">${blow} Blow</span></span>
    `;
    historyList.appendChild(item);
  }

  function handleCorrect() {
    if (mode === 'survival' || mode === 'beginner') {
      resultMessage.textContent = `正解！ ${guessesUsed}回で当てました。`;
      resultMessage.className = 'result-message win';
      gameActive = false;
    } else if (mode === 'master') {
      masterStreakCount++;
      if (masterStreakCount >= masterStreakTarget) {
        resultMessage.textContent = `クリア！ ${masterStreakTarget}問連続正解達成！`;
        resultMessage.className = 'result-message win';
        gameActive = false;
      } else {
        resultMessage.textContent = `正解！ 連続正解 ${masterStreakCount}/${masterStreakTarget}　次の問題へ`;
        resultMessage.className = 'result-message win';
        guessesUsed = 0;
        historyList.innerHTML = '';
        newPuzzleReset();
      }
    }
    updateStatusBar();
  }

  function handleWrong() {
    if (mode === 'survival' && guessesUsed >= maxGuesses) {
      gameActive = false;
      resultMessage.textContent = `失敗… 正解は ${answer.join('')} でした。`;
      resultMessage.className = 'result-message lose';
    } else if (mode === 'master' && guessesUsed >= masterGuessLimitPerRound) {
      gameActive = false;
      resultMessage.textContent = `失敗… 連続正解は ${masterStreakCount}問でストップ。正解は ${answer.join('')} でした。`;
      resultMessage.className = 'result-message lose';
    }
    updateStatusBar();
  }

  function updateStatusBar() {
    statusBar.innerHTML = '';
    const chips = [];

    if (mode === 'survival') {
      const remaining = Math.max(0, maxGuesses - guessesUsed);
      chips.push(`モード: <b>サバイバル</b>`);
      chips.push(`残り質問回数: <b>${remaining} / ${maxGuesses}</b>`);
    } else if (mode === 'beginner') {
      chips.push(`モード: <b>ビギナーズ</b>`);
      chips.push(`現在の質問回数: <b>${guessesUsed}回</b>（無制限）`);
    } else if (mode === 'master') {
      const remainingRound = Math.max(0, masterGuessLimitPerRound - guessesUsed);
      chips.push(`モード: <b>マスター</b>`);
      chips.push(`連続正解: <b>${masterStreakCount} / ${masterStreakTarget}</b>`);
      chips.push(`この問題の残り回数: <b>${remainingRound}</b>`);
    }

    chips.forEach(html => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = html;
      statusBar.appendChild(chip);
    });
  }
})();
</script>
</body>
</html>
